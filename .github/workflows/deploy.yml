name: CI/CD Deployment Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Tests
        run: npm test

  build:
    name: Build & Package Website
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Static Artifacts
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: dist/
          retention-days: 1

  deploy:
    name: Deploy to AWS S3 & CloudFront
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-files
          path: dist

      - name: Verify AWS role configuration
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          ROLE_NAME="${AWS_ROLE_ARN##*/}"
          ACCOUNT_ID="$(printf '%s' "$AWS_ROLE_ARN" | cut -d: -f5)"
          echo "AWS account: ${ACCOUNT_ID}"
          echo "AWS role name: ${ROLE_NAME}"
          if [ "$ROLE_NAME" != "GitHubActionsDevOpsDeploymentRole" ]; then
            echo "::error::AWS_ROLE_ARN must reference GitHubActionsDevOpsDeploymentRole"
            exit 1
          fi

      - name: Show GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com')
            const payload = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString())
            core.info(JSON.stringify({
              sub: payload.sub,
              aud: payload.aud,
              repository: payload.repository,
              ref: payload.ref
            }, null, 2))

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-skip-session-tagging: true

      - name: Sync Static Files to Amazon S3
        run: |
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET_NAME }} --delete

      - name: Invalidate CloudFront Cache (Optional / Recommended)
        if: env.DISTRIBUTION_ID != ''
        env:
          DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation --distribution-id $DISTRIBUTION_ID --paths "/*"
